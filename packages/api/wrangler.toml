name = "run-dashboard-api"
main = "src/index.ts"
compatibility_date = "2026-08-15"

# ── Local development ────────────────────────────────────────────────────────
#
# Everything below has a local implementation in `wrangler dev`: D1 becomes a
# real SQLite file under .wrangler/, R2 becomes a directory. No Cloudflare
# account is needed to run or develop this — which is the difference between a
# reader trying it in a minute and a reader closing the tab.
#
# `database_id` is read from the real D1 instance at deploy time; local
# `wrangler dev` and `wrangler d1 migrations ... --local` resolve by
# `database_name` instead, so this being a real id changes nothing locally.

[[d1_databases]]
binding = "DB"
database_name = "run-dashboard"
database_id = "c9c2c906-5d17-4560-ab10-c2df3e34dfcf"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "REPORTS"
bucket_name = "run-dashboard-reports"

# Every ten minutes, end runs that were never going to report (see src/stale.ts).
# A cron costs one UPDATE; with none, a run whose callback never arrives is
# `running` for ever and the page polls for as long as it is open.
# The same tick removes expired sandboxes with everything they held, the
# simulated runs from before sandboxes, and the oldest stored reports once
# there are more than 500 (see src/retention.ts).
[triggers]
crons = ["*/10 * * * *"]

# No [vars]. Nothing is dispatched (decision 52), so there is no repository to
# name and no flag to switch it on; whether a deployment must have its secrets
# is decided by the host a request reaches (assertDeployable in src/config.ts).
#
# Secrets — set with `wrangler secret put <NAME>` for a real deployment, or in
# `.dev.vars` locally. Defaults exist for all of them so a clone runs as-is:
#   WEBHOOK_SECRET_API / WEBHOOK_SECRET_UI
#                    sign the result callback of one suite each — each must match
#                    DASHBOARD_WEBHOOK_SECRET in that suite's repository only
#                    (decision 50). WEBHOOK_SECRET, the one both suites used to
#                    share, still counts for both while it is set
#   TOKEN_SECRET     signs sessions, admin keys and report-access links
