<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Run Dashboard</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f6bed'/><line x1='11' y1='7' x2='21' y2='7' stroke='white' stroke-width='2.5' stroke-linecap='round'/><path d='M13 7v8L7 23a2 2 0 0 0 1.6 3.2h14.8A2 2 0 0 0 25 23l-6-8V7' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='19' cy='21' r='2' fill='rgba(255,255,255,0.9)'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      ;(function () {
        var t = localStorage.getItem('rd_theme')
        if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
      })()
    </script>
    <style>
      /*
       * The palette, as CSS variables.
       *
       * Two themes off one set of names: components never branch on theme, they
       * use `var(--c-card)` and get the right value. Adding a third would be a
       * block here rather than an edit to every component.
       *
       * Text tones are numbered t1..t6 (darkest to lightest) rather than named
       * primary/secondary/muted — names run out at three, numbers do not, and a
       * reader can tell at a glance which of two labels is meant to recede.
       */
      :root {
        --c-bg: #f5f5f5;
        --c-card: #ffffff;
        --c-surface: #fafafa;
        --c-input: #ffffff;
        --c-hover: #f2f5ff;
        --c-border: #e8e8e8;
        --c-divider: #f0f0f0;
        --c-t1: #0f172a;
        --c-t2: #1e293b;
        --c-t3: #475569;
        --c-t4: #64748b;
        --c-t5: #94a3b8;
        --c-t6: #cbd5e1;
        --c-primary: #4f6bed;
        --c-primary-dark: #3f57cc;
        --c-primary-light: #eef1fe;
        --c-primary-border: #c7d0fb;
      }
      [data-theme='dark'] {
        --c-bg: #0d1117;
        --c-card: #161b22;
        --c-surface: #21262d;
        --c-input: #0d1117;
        --c-hover: #141a2b;
        --c-border: #30363d;
        --c-divider: #21262d;
        --c-t1: #e6edf3;
        --c-t2: #cdd9e5;
        --c-t3: #8b949e;
        --c-t4: #768390;
        --c-t5: #6e7681;
        --c-t6: #3d444d;
        --c-primary: #6d84f2;
        --c-primary-dark: #5a70e0;
        --c-primary-light: rgba(109, 132, 242, 0.14);
        --c-primary-border: rgba(109, 132, 242, 0.32);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          'Prompt',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: var(--c-bg);
        color: var(--c-t1);
        -webkit-font-smoothing: antialiased;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.75);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
