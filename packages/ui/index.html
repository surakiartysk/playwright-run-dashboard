<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Run Dashboard</title>
    <!--
      What a link shows when it is pasted into LinkedIn, Slack or a chat. With
      only a <title>, a shared link arrived as a bare grey line. The image URL
      is absolute because the crawlers that read it do not resolve relative
      ones; a clone deployed elsewhere still points at this deployment's copy
      of the same picture. scripts/og-card.html is its source, and its role
      table is copied from packages/api/src/policy.ts by hand.
    -->
    <meta
      name="description"
      content="Runs two published Playwright suites on demand, and decides who may run what, and who may see the result. Sign in as demo to try it."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Test Run Dashboard" />
    <meta
      property="og:description"
      content="Runs two published Playwright suites on demand, and decides who may run what, and who may see the result."
    />
    <meta property="og:image" content="https://runs.testbydesign.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Test Run Dashboard, with a table of what each role may run: demo main and always simulated, dev main, qa main, develop and release branches, admin any branch."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%231f2937'/><line x1='11' y1='7' x2='21' y2='7' stroke='white' stroke-width='2.5' stroke-linecap='round'/><path d='M13 7v8L7 23a2 2 0 0 0 1.6 3.2h14.8A2 2 0 0 0 25 23l-6-8V7' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='19' cy='21' r='2' fill='rgba(255,255,255,0.9)'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      ;(function () {
        // Both directions are stamped: a stored 'light' has to beat a dark OS,
        // or the media query below overrides the viewer's own choice.
        var t = localStorage.getItem('rd_theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
        // An unknown name matches no rule, which leaves the default accent.
        var a = localStorage.getItem('rd_accent')
        if (a && /^[a-z]+$/.test(a)) document.documentElement.setAttribute('data-accent', a)
      })()
    </script>
    <style>
      /*
       * The palette, as CSS variables, is generated from src/tokens.ts when
       * the page is built (tokensPlugin in vite.config.ts) and put where the
       * marker below is. It used to be written out here three times — light,
       * dark for a dark OS, dark for an explicit choice — and a fourth accent
       * colour would have made it twelve.
       *
       * Components never branch on theme: they use `var(--c-card)` and get the
       * right value. Text tones are numbered t1..t6 (darkest to lightest)
       * rather than named, and t1–t5 each clear WCAG AA on every background in
       * every mode — test/palette.test.ts checks the table, not this file.
       */
      /* @tokens */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        /*
         * Manrope for anything a person wrote, JetBrains Mono for anything the
         * machine produced — run ids, counts, durations, refs. That split is
         * the page's one typographic rule, and it does information-design work:
         * a reader can tell generated data from prose without reading either.
         * The faces are --font-ui and --font-mono (src/tokens.ts), so changing
         * one is a single line.
         */
        font-family: var(--font-ui);
        background: var(--c-bg);
        color: var(--c-t1);
        -webkit-font-smoothing: antialiased;
      }

      /*
       * A visible focus ring on everything a keyboard can reach.
       *
       * The text fields used to switch their outline off in an inline style and
       * put nothing in its place — inline styles cannot express :focus — so a
       * person tabbing through a form could not see where they were. One rule
       * here covers every control, in whichever accent is chosen, and the
       * components no longer opt out of it.
       */
      /* Off the page until a keyboard reaches it, then the first thing on it. */
      .skip-link {
        position: absolute;
        left: 12px;
        top: -48px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--c-card);
        color: var(--c-t1);
        border: 1px solid var(--c-border);
        z-index: 10;
      }
      .skip-link:focus {
        top: 12px;
      }

      :where(button, input, select, textarea, a, summary):focus-visible {
        outline: 2px solid var(--c-primary);
        outline-offset: 2px;
      }

      /*
       * On a touch screen, every field at 16px. Below that, iOS Safari zooms
       * the page in when a field is focused and leaves it zoomed; most fields
       * here were 13–14px. Login already set 16px for this reason, and only
       * Login. !important because the components size their fields inline.
       */
      @media (pointer: coarse) {
        input,
        select,
        textarea {
          font-size: 16px !important;
        }

        /*
         * Every control answers a tap at least 44px square, without being drawn
         * any bigger: an invisible area centred on it. Measured at 375px wide
         * with touch, 43 of 47 controls took taps on less than that — the
         * workers −/+ at 31x32, the Copy buttons 19px tall, the status chips
         * 25. Where two sit closer than 44px apart, the later one takes the
         * overlap.
         */
        button,
        summary {
          position: relative;
        }
        button::before,
        summary::before {
          content: '';
          position: absolute;
          left: 50%;
          top: 50%;
          width: max(100%, 44px);
          height: max(100%, 44px);
          transform: translate(-50%, -50%);
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(-4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes indeterminate {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(263%);
        }
      }
      /*
       * For anyone who asked their system for less motion, everything here
       * stops. Nothing relies on it: a running run is still marked by its
       * label and colour, the spinner just sits still, and the page was
       * already complete without the entrance fades. Animations are cut to
       * one frame rather than removed so that an element which starts
       * invisible and animates in still ends up visible.
       */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
