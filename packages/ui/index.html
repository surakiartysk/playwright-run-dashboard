<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Run Dashboard</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f6bed'/><line x1='11' y1='7' x2='21' y2='7' stroke='white' stroke-width='2.5' stroke-linecap='round'/><path d='M13 7v8L7 23a2 2 0 0 0 1.6 3.2h14.8A2 2 0 0 0 25 23l-6-8V7' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='19' cy='21' r='2' fill='rgba(255,255,255,0.9)'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      ;(function () {
        // Both directions are stamped: a stored 'light' has to beat a dark OS,
        // or the media query below overrides the viewer's own choice.
        var t = localStorage.getItem('rd_theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
    <style>
      /*
       * The palette, as CSS variables.
       *
       * Two themes off one set of names: components never branch on theme, they
       * use `var(--c-card)` and get the right value. Adding a third would be a
       * block here rather than an edit to every component.
       *
       * Text tones are numbered t1..t6 (darkest to lightest) rather than named
       * primary/secondary/muted — names run out at three, numbers do not, and a
       * reader can tell at a glance which of two labels is meant to recede.
       */
      :root {
        --c-bg: #f3f6f9;
        --c-card: #ffffff;
        --c-surface: #eaeff5;
        --c-input: #ffffff;
        --c-hover: #eef2fc;
        --c-border: #dce3ec;
        --c-divider: #e9eef4;
        --c-t1: #10151c;
        --c-t2: #2a323d;
        --c-t3: #4c5765;
        --c-t4: #6a7583;
        --c-t5: #8a939f;
        --c-t6: #c2cad3;
        --c-primary: #2f4ecc;
        --c-primary-dark: #2540ad;
        --c-primary-light: #e9edfb;
        --c-primary-border: #c2cef2;
        --c-brand-1: #131a3d;
        --c-brand-2: #222f6b;
        --c-brand-3: #33429a;
        --c-brand-glow: rgba(126, 148, 255, 0.3);
        --c-brand-glow-faint: rgba(126, 148, 255, 0.16);
      }
      /*
       * Three states, not two. An explicit choice stamps the root; the
       * default 'system' setting stamps nothing, and only the media query
       * separates light from dark there — without it a dark-OS visitor who
       * has never touched the toggle was served the light theme.
       */
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) {
          --c-bg: #0e1116;
          --c-card: #161a21;
          --c-surface: #1e242d;
          --c-input: #10141a;
          --c-hover: #1a2130;
          --c-border: #2a313b;
          --c-divider: #212730;
          --c-t1: #e9edf2;
          --c-t2: #c7cfda;
          --c-t3: #97a1ad;
          --c-t4: #7b8693;
          --c-t5: #67717d;
          --c-t6: #3a424d;
          --c-primary: #8098f7;
          --c-primary-dark: #93a8ff;
          --c-primary-light: rgba(128, 152, 247, 0.14);
          --c-primary-border: rgba(128, 152, 247, 0.34);
          --c-brand-1: #0a0d15;
          --c-brand-2: #141b36;
          --c-brand-3: #1f2a5c;
          --c-brand-glow: rgba(128, 152, 247, 0.22);
          --c-brand-glow-faint: rgba(128, 152, 247, 0.12);
        }
      }

      [data-theme='dark'] {
        --c-bg: #0e1116;
        --c-card: #161a21;
        --c-surface: #1e242d;
        --c-input: #10141a;
        --c-hover: #1a2130;
        --c-border: #2a313b;
        --c-divider: #212730;
        --c-t1: #e9edf2;
        --c-t2: #c7cfda;
        --c-t3: #97a1ad;
        --c-t4: #7b8693;
        --c-t5: #67717d;
        --c-t6: #3a424d;
        --c-primary: #8098f7;
        --c-primary-dark: #93a8ff;
        --c-primary-light: rgba(128, 152, 247, 0.14);
        --c-primary-border: rgba(128, 152, 247, 0.34);
        --c-brand-1: #0a0d15;
        --c-brand-2: #141b36;
        --c-brand-3: #1f2a5c;
        --c-brand-glow: rgba(128, 152, 247, 0.22);
        --c-brand-glow-faint: rgba(128, 152, 247, 0.12);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        /*
         * Archivo for anything a person wrote, JetBrains Mono for anything the
         * machine produced — run ids, counts, durations, refs. That split is
         * the page's one typographic rule, and it does information-design work:
         * a reader can tell generated data from prose without reading either.
         *
         * Prompt was here before, inherited from the dashboard this one is
         * modelled on. It is a Thai typeface on an all-English tool, and a
         * house face is identity in the same way a brand colour is — the
         * argument decision 10 makes about the accent, applied to the type.
         */
        font-family:
          'Archivo',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        background: var(--c-bg);
        color: var(--c-t1);
        -webkit-font-smoothing: antialiased;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.75);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
