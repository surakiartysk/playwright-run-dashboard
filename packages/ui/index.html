<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Test Run Dashboard</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%234f6bed'/><line x1='11' y1='7' x2='21' y2='7' stroke='white' stroke-width='2.5' stroke-linecap='round'/><path d='M13 7v8L7 23a2 2 0 0 0 1.6 3.2h14.8A2 2 0 0 0 25 23l-6-8V7' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/><circle cx='19' cy='21' r='2' fill='rgba(255,255,255,0.9)'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Applied before first paint so a dark-mode user never sees a white flash.
      ;(function () {
        // Both directions are stamped: a stored 'light' has to beat a dark OS,
        // or the media query below overrides the viewer's own choice.
        var t = localStorage.getItem('rd_theme')
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t)
        // An unknown name matches no rule, which leaves the default accent.
        var a = localStorage.getItem('rd_accent')
        if (a && /^[a-z]+$/.test(a)) document.documentElement.setAttribute('data-accent', a)
      })()
    </script>
    <style>
      /*
       * The palette, as CSS variables, is generated from src/tokens.ts when
       * the page is built (tokensPlugin in vite.config.ts) and put where the
       * marker below is. It used to be written out here three times — light,
       * dark for a dark OS, dark for an explicit choice — and a fourth accent
       * colour would have made it twelve.
       *
       * Components never branch on theme: they use `var(--c-card)` and get the
       * right value. Text tones are numbered t1..t6 (darkest to lightest)
       * rather than named, and t1–t5 each clear WCAG AA on every background in
       * every mode — test/palette.test.ts checks the table, not this file.
       */
      /* @tokens */

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        /*
         * Manrope for anything a person wrote, JetBrains Mono for anything the
         * machine produced — run ids, counts, durations, refs. That split is
         * the page's one typographic rule, and it does information-design work:
         * a reader can tell generated data from prose without reading either.
         * The faces are --font-ui and --font-mono (src/tokens.ts), so changing
         * one is a single line.
         */
        font-family: var(--font-ui);
        background: var(--c-bg);
        color: var(--c-t1);
        -webkit-font-smoothing: antialiased;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pop-in {
        from {
          opacity: 0;
          transform: scale(0.94) translateY(-4px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.4;
          transform: scale(0.75);
        }
      }

      /*
       * For anyone who asked their system for less motion, everything here
       * stops. Nothing relies on it: a running run is still marked by its
       * label and colour, the spinner just sits still, and the page was
       * already complete without the entrance fades. Animations are cut to
       * one frame rather than removed so that an element which starts
       * invisible and animates in still ends up visible.
       */
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }

      /*
       * The sign-in split collapses below 820px.
       *
       * Two columns on a phone gave the panel 320px of a 499px viewport and
       * left the form 83px wide, with the password field off the right edge —
       * the page could not be signed into at all on a phone. Narrow screens
       * get the form, full width, and the identity panel becomes a short band
       * above it rather than a column beside it.
       */
      @media (max-width: 820px) {
        .login-split {
          flex-direction: column;
          min-height: 100vh;
          /* The cap and its edges are for wide screens; on a phone the split
             fills the viewport, and a side border there is a 1px stripe down
             the screen edge. Inline styles again, so these need the override. */
          max-width: none !important;
          border-left: none !important;
          border-right: none !important;
        }
        /* The panel's width/min-width are inline styles on the element, so the
           collapse has to override them explicitly. */
        .login-panel {
          width: 100% !important;
          max-width: none !important;
          min-width: 0 !important;
          padding: 26px 0 30px;
        }
        /*
         * The circles are sized for a tall column and crop into visible arcs in
         * a short band; and stacked, the two flask marks sit directly above one
         * another, so the panel's keeps the title company and the form's goes.
         */
        .login-panel > .login-orb,
        .login-panel-detail,
        .login-form-col .login-form-icon {
          display: none !important;
        }

        .login-form-col {
          justify-content: center;
          padding: 32px 24px 48px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
